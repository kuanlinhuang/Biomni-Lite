services:
  biomni-lite:
    build: .
    image: biomni-lite:latest
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - BIOMNI_PATH=/workspace/data
      - BIOMNI_LLM=${BIOMNI_LLM:-claude-opus-4-5}
      - BIOMNI_AGENT=${BIOMNI_AGENT:-}
    volumes:
      # Persist downloaded data lake files and run outputs across container restarts
      - biomni_data:/workspace/data
      # Mount local workspace for custom scripts and results
      - ./workspace:/workspace/runs
    working_dir: /workspace
    stdin_open: true
    tty: true

  biomni-lite-gradio:
    build: .
    image: biomni-lite:latest
    command: python /app/serve.py
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - BIOMNI_PATH=/workspace/data
      - BIOMNI_LLM=${BIOMNI_LLM:-claude-opus-4-5}
      - BIOMNI_AGENT=${BIOMNI_AGENT:-}
    volumes:
      - biomni_data:/workspace/data
      - ./workspace:/workspace/runs
    ports:
      - "7860:7860"

volumes:
  biomni_data:
